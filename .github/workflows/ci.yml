name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Test (coverage >= 90%)
        run: pytest --cov-report=xml
      - name: OpenAPI spec is up to date
        if: matrix.python-version == '3.12'
        run: |
          corpnorm openapi -o docs/openapi.json
          git diff --exit-code docs/openapi.json

  pure-python:
    # rapidfuzz 非導入環境（純 Python の Levenshtein）でも同じ結果になることを確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,redis,yaml]" pytest pytest-cov fakeredis
      - run: pytest --cov-fail-under=0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t corpnorm:ci .
      - name: Smoke test
        run: |
          docker run --rm corpnorm:ci name "ｶ)ﾔﾏﾀﾞｼｮｳｼﾞ"
          docker run -d --name api -p 8000:8000 corpnorm:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS -X POST localhost:8000/v1/normalize/name \
            -H 'content-type: application/json' -d '{"name":"(株)山田商事"}'
